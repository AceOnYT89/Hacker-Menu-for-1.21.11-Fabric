        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/repository/maven-public/'
        }
        maven {
            name = 'Mojang'
            url = 'https://libraries.minecraft.net/'
        }
        mavenCentral()
    }
}

rootProject.name = 'hackermenu-fabric-1.21.11'
